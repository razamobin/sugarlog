<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <header class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-4 max-w-4xl">
            <div class="flex justify-between items-center">
                <a href="/" class="text-3xl font-semibold no-underline">
                    sugar<span class="text-pink-600">log</span>
                </a>
                <a
                    href="/"
                    class="bg-pink-600 text-white px-4 py-2 rounded hover:bg-pink-700 transition"
                >Home</a>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <form action="/slnew" method="post" class="bg-white rounded-lg shadow-md p-6">
            <div class="mb-4">
                <label class="block text-sm font-medium mb-2">Date:</label>
                <div class="flex space-x-2">
                    <select name="month" class="flex-1 p-2 border rounded">
                        {% for m in ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'] %}
                            <option{{ ' selected' if month == m else ''}}>{{ m }}</option>
                        {% endfor %}
                    </select>
                    <select name="day" class="flex-1 p-2 border rounded">
                        {% for i in range(1,32) %}
                            <option{{ ' selected' if day == i else ''}}>{{ i }}</option>
                        {% endfor %}
                    </select>
                    <select name="year" class="flex-1 p-2 border rounded">
                        {% for i in range(2000,2101) %}
                            <option{{ ' selected' if year == i else ''}}>{{ i }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="mb-4">
                <label for="blood_sugar" class="block text-sm font-medium mb-2">Blood Sugar:</label>
                <input type="text" name="blood_sugar" class="w-full p-2 border rounded" maxlength="4" />
            </div>
            <div class="mb-4">
                <label for="notes" class="block text-sm font-medium mb-2">Notes (food, medicine, exercise, etc):</label>
                <textarea name="notes" rows="4" class="w-full p-2 border rounded"></textarea>
            </div>
            <button type="submit" class="w-full bg-pink-600 text-white px-4 py-2 rounded hover:bg-pink-700 transition">Submit</button>
        </form>
    </div>
</body>
</html>
